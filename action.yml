name: Hephaestus
description: Forge release artifacts into reliable distributions — archives, GitHub Releases and Homebrew formulas for any language.
author: magicdrive
branding:
  icon: package
  color: orange

inputs:
  command:
    description: "hephaestus command: run, check, build, archive, checksum, release, formula, tap or preflight."
    default: run
  stages:
    description: "With command=run: comma-separated stages (build,archive,checksum,release,formula,tap) or all. Default: every configured stage."
    default: ""
  config:
    description: Path to the configuration file, relative to working-directory.
    default: ""
  tag:
    description: Release tag. Defaults to the pushed tag (github.ref_name on tag events). Required with command=preflight (the tag about to be pushed).
    default: ""
  strict:
    description: 'With command=preflight: treat WARN and UNKNOWN checks as failures.'
    default: "false"
  offline:
    description: 'With command=preflight: run only the checks that need no network.'
    default: "false"
  snapshot:
    description: Build without a tag (no release or tap publication).
    default: "false"
  dry-run:
    description: Plan GitHub writes without performing them.
    default: "false"
  fresh:
    description: Ignore an existing artifact manifest.
    default: "false"
  working-directory:
    description: Directory to run in.
    default: "."
  github-token:
    description: Token for the release repository (needs contents:write to publish).
    default: ${{ github.token }}
  tap-token:
    description: Token with contents:write (and pull-requests:write for PR mode) on the Homebrew tap. GITHUB_TOKEN cannot write to another repository.
    default: ""

outputs:
  status:
    description: "published, no-op, dry-run or failed."
    value: ${{ steps.publish.outputs.status || steps.local.outputs.status }}
  no-op:
    description: '"true" when nothing changed on GitHub.'
    value: ${{ steps.publish.outputs.no-op || steps.local.outputs.no-op }}
  version:
    description: Version being released.
    value: ${{ steps.publish.outputs.version || steps.local.outputs.version }}
  artifacts:
    description: JSON list of archives and checksum files (name, path, sha256, url).
    value: ${{ steps.publish.outputs.artifacts || steps.local.outputs.artifacts }}
  release-url:
    description: URL of the GitHub Release.
    value: ${{ steps.publish.outputs.release-url || steps.local.outputs.release-url }}
  release-id:
    description: ID of the GitHub Release.
    value: ${{ steps.publish.outputs.release-id || steps.local.outputs.release-id }}
  uploaded-assets:
    description: JSON list of asset names uploaded or replaced in this run.
    value: ${{ steps.publish.outputs.uploaded-assets || steps.local.outputs.uploaded-assets }}
  formula-paths:
    description: Newline-separated paths of generated formulas.
    value: ${{ steps.publish.outputs.formula-paths || steps.local.outputs.formula-paths }}
  formula-commit-sha:
    description: Newline-separated tap commit SHAs.
    value: ${{ steps.publish.outputs.formula-commit-sha || steps.local.outputs.formula-commit-sha }}
  pull-request-url:
    description: Newline-separated tap pull request URLs.
    value: ${{ steps.publish.outputs.pull-request-url || steps.local.outputs.pull-request-url }}
  preflight-status:
    description: "With command=preflight: pass, warn, unknown or fail."
    value: ${{ steps.preflight.outputs.status }}
  preflight-exit-code:
    description: "With command=preflight: 0 pass, 1 fail (or strict WARN/UNKNOWN), 2 usage, 3 unknown."
    value: ${{ steps.preflight.outputs.exit-code }}
  preflight-report:
    description: "With command=preflight: path of the JSON report."
    value: ${{ steps.preflight.outputs.report }}

runs:
  using: composite
  steps:
    # Hephaestus is built from this action's own pinned source, so the code
    # that runs is exactly the code at the ref you reference (pin a SHA).
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    - name: Build hephaestus
      id: build
      shell: bash
      # The caller's Go settings (earlier steps, workflow env, $GITHUB_ENV)
      # must not change how the action itself is built: pin the module
      # proxy and checksum database, disable go.work, the go env file and
      # private/insecure module patterns, and drop GOFLAGS such as
      # -toolexec or -mod=mod. GOCACHE and GOMODCACHE are set in the script
      # to a new directory, so a build or module cache restored by an
      # earlier step (setup-go with cache: true, actions/cache) is not used.
      env:
        ACTION_PATH: ${{ github.action_path }}
        GOFLAGS: -mod=readonly
        GOPROXY: https://proxy.golang.org,direct
        GOSUMDB: sum.golang.org
        GONOSUMDB: ""
        GONOSUMCHECK: ""
        GONOPROXY: ""
        GOPRIVATE: ""
        GOINSECURE: ""
        GOWORK: "off"
        GOENV: "off"
        GOTOOLCHAIN: auto
        GOEXPERIMENT: ""
        CGO_ENABLED: "0"
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP" src="$ACTION_PATH" bin_ext=""
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          # Git Bash tools and the native go.exe both accept D:/a/_temp;
          # RUNNER_TEMP arrives as D:\a\_temp.
          tmp="$(cygpath -m "$RUNNER_TEMP")" src="$(cygpath -m "$ACTION_PATH")" bin_ext=".exe"
        fi
        gotmp="$(mktemp -d "$tmp/hephaestus-go.XXXXXXXX")"
        export GOCACHE="$gotmp/cache" GOMODCACHE="$gotmp/mod"
        cd "$src"
        bin="$tmp/hephaestus-bin/hephaestus$bin_ext"
        go build -trimpath -mod=readonly -o "$bin" .
        chmod -R u+w "$gotmp" && rm -rf "$gotmp"
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
    # Local stages (build, archive, checksum) run in a step whose environment
    # holds no token at all: build commands run third-party code, which could
    # otherwise read the tokens from this step's processes. With command
    # run, the local phase runs here and the publish phase in the next step,
    # continuing from the manifest in dist/.
    - name: Run hephaestus (local stages)
      id: local
      if: inputs.command != 'release' && inputs.command != 'formula' && inputs.command != 'tap' && inputs.command != 'preflight'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_STAGES: ${{ inputs.stages }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_FRESH: ${{ inputs.fresh }}
        HEPHAESTUS_BIN: ${{ steps.build.outputs.bin }}
        # A step inherits the job's and the workflow's env. Blank the tokens
        # a caller commonly sets there (and the OIDC request token), so no
        # process of this step, which build code can inspect, holds them.
        # Tokens under other names are removed from build commands'
        # environment by Hephaestus but stay visible in this step's shell:
        # do not set publishing tokens in job or workflow env.
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        GITHUB_PAT: ""
        GH_ENTERPRISE_TOKEN: ""
        GITHUB_ENTERPRISE_TOKEN: ""
        HOMEBREW_TAP_GITHUB_TOKEN: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      run: |
        set -euo pipefail
        case "$INPUT_COMMAND" in
          run|check|build|archive|checksum) ;;
          *) echo "::error::invalid command input"; exit 2 ;;
        esac
        args=("$INPUT_COMMAND")
        [[ -n "$INPUT_CONFIG" ]] && args+=(--config "$INPUT_CONFIG")
        if [[ "$INPUT_COMMAND" != check ]]; then
          [[ -n "$INPUT_TAG" ]] && args+=(--tag "$INPUT_TAG")
          [[ "$INPUT_SNAPSHOT" == true ]] && args+=(--snapshot)
          [[ "$INPUT_DRY_RUN" == true ]] && args+=(--dry-run)
          [[ "$INPUT_FRESH" == true ]] && args+=(--fresh)
        fi
        if [[ "$INPUT_COMMAND" == run ]]; then
          [[ -n "$INPUT_STAGES" ]] && args+=(--stages "$INPUT_STAGES")
          args+=(--phase local)
        fi
        # The runner injects the OIDC request token into every step even
        # when env blanks it, and build code can read this shell's
        # /proc/PID/environ. exec replaces the shell, so no ancestor of the
        # build below the runner still holds it.
        exec env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN \
          "$HEPHAESTUS_BIN" "${args[@]}"
    # Publishing stages (release, formula, tap) get the tokens. With command
    # run, this is the publish phase; it is skipped when the local step
    # failed.
    - name: Run hephaestus (publish stages)
      id: publish
      if: inputs.command == 'run' || inputs.command == 'release' || inputs.command == 'formula' || inputs.command == 'tap'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_STAGES: ${{ inputs.stages }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_FRESH: ${{ inputs.fresh }}
        LOCAL_STATUS: ${{ steps.local.outputs.status }}
        HEPHAESTUS_BIN: ${{ steps.build.outputs.bin }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ inputs.tap-token }}
      run: |
        set -euo pipefail
        args=("$INPUT_COMMAND")
        [[ -n "$INPUT_CONFIG" ]] && args+=(--config "$INPUT_CONFIG")
        [[ -n "$INPUT_TAG" ]] && args+=(--tag "$INPUT_TAG")
        [[ "$INPUT_SNAPSHOT" == true ]] && args+=(--snapshot)
        [[ "$INPUT_DRY_RUN" == true ]] && args+=(--dry-run)
        # With run, the local step already applied --fresh (when it ran any
        # stage); the publish phase continues from its manifest.
        if [[ "$INPUT_FRESH" == true && ( "$INPUT_COMMAND" != run || -z "$LOCAL_STATUS" ) ]]; then
          args+=(--fresh)
        fi
        if [[ "$INPUT_COMMAND" == run ]]; then
          [[ -n "$INPUT_STAGES" ]] && args+=(--stages "$INPUT_STAGES")
          args+=(--phase publish)
        fi
        "$HEPHAESTUS_BIN" "${args[@]}"
    # The preflight only reads (GET requests, read-only git) and runs no
    # repository code, so it may hold the read token. Its exit code is the
    # step's: 0 pass, 1 fail, 2 usage, 3 some checks unknown.
    - name: Run hephaestus (preflight)
      id: preflight
      if: inputs.command == 'preflight'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        HEPHAESTUS_BIN: ${{ steps.build.outputs.bin }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HOMEBREW_TAP_GITHUB_TOKEN: ""
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP"
        if [[ "$RUNNER_OS" == Windows ]]; then tmp="$(cygpath -m "$RUNNER_TEMP")"; fi
        report="$tmp/hephaestus-preflight.json"
        rm -f "$report"
        args=(preflight --tag "$INPUT_TAG" --report "$report")
        [[ -n "$INPUT_CONFIG" ]] && args+=(--config "$INPUT_CONFIG")
        [[ "$INPUT_STRICT" == true ]] && args+=(--strict)
        [[ "$INPUT_OFFLINE" == true ]] && args+=(--offline)
        set +e
        "$HEPHAESTUS_BIN" "${args[@]}"
        code=$?
        set -e
        status=""
        if [[ -f "$report" ]]; then
          status="$(jq -r .status "$report" | tr -d '\r')"
          echo "report=$report" >> "$GITHUB_OUTPUT"
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
