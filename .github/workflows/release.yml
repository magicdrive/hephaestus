name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PROVENANCE: a tag's commit must be in the history of an allowed release
  # branch (only main, the default branch): a v* tag pushed on any other
  # commit (another branch, a commit on no branch) builds and publishes
  # nothing. The script fetches the tag and the branch afresh, requires the
  # tag to name this run's commit and fails closed on anything it cannot
  # establish (.github/release/verify-tag-provenance.sh). To release from a
  # maintenance branch, add its exact name after main.
  provenance:
    needs: [ci]
    # Pinned: ubuntu-latest moves to 26.04 in November 2026 (actions/runner-images#14748);
    # the release path changes its image only through a reviewed pull request.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is on an allowed release branch
        run: .github/release/verify-tag-provenance.sh --ref "$GITHUB_REF" --sha "$GITHUB_SHA" main

  ci:
    # The full CI, at the tagged commit, is the release gate.
    uses: ./.github/workflows/ci.yml
    # A called workflow's jobs get at most what the caller grants:
    # action-boundary needs id-token: write to prove the token does not
    # reach build code.
    permissions:
      contents: read
      id-token: write

  build:
    # Builds, packages and verifies the release with read-only permissions.
    # Build steps run code from the module graph; they get no token that
    # can write to the repository or request an OIDC token (which could sign
    # provenance for other files). Only the verified dist/ moves on.
    needs: [ci, provenance]
    # Pinned: ubuntu-latest moves to 26.04 in November 2026 (actions/runner-images#14748);
    # the release path changes its image only through a reviewed pull request.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the release tag
        # Rejects a tag that is not vMAJOR.MINOR.PATCH[-PRERELEASE] before
        # anything is built (internal/publish.ParseVersion), and a tag that
        # action/VERSION does not name: the action at the tagged commit
        # downloads the binaries of the release action/VERSION names
        # (action/install-hephaestus.sh), which must be this one.
        run: |
          go run ./internal/cmd/publish plan "$GITHUB_REF_NAME"
          [[ "$(tr -d '\r\n' < action/VERSION)" == "$GITHUB_REF_NAME" ]] ||
            { echo "::error::action/VERSION is $(cat action/VERSION), not $GITHUB_REF_NAME"; exit 1; }
      - name: Build hephaestus from the tagged source
        run: make build
      - name: Build, archive and checksum
        run: ./build/hephaestus run --stages build,archive,checksum --fresh
      - name: Verify dist
        run: scripts/verify-dist.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    # Publishes the verified dist/ from the build job. No project build
    # command runs here: only Hephaestus itself is compiled, from the
    # tagged source, to publish.
    needs: [provenance, ci, build]
    # Pinned: ubuntu-latest moves to 26.04 in November 2026 (actions/runner-images#14748);
    # the release path changes its image only through a reviewed pull request.
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # sign provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build hephaestus from the tagged source
        run: make build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify dist again before publishing anything
        run: scripts/verify-dist.sh dist
      - name: Plan the release
        # Whether this tag is a prerelease and whether the tap is published
        # (skip_upload), decided by the same Go code as the tap stage
        # (internal/publish.Plan), not by matching the tag here. The tap
        # token is passed only to the steps that publish the tap.
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan="$(go run ./internal/cmd/publish plan "$GITHUB_REF_NAME")"
          echo "$plan"
          # An unexpected plan would skip both tap steps without failing.
          grep -qxE 'tap=(publish|skip)' <<<"$plan" || { echo "::error::unexpected release plan"; exit 1; }
          # This repository never publishes a prerelease to the tap; a
          # configuration change that would do so stops before any write.
          if grep -qx 'prerelease=true' <<<"$plan" && ! grep -qx 'tap=skip' <<<"$plan"; then
            echo "::error::a prerelease must not update the tap (brews.skip_upload: auto)"; exit 1
          fi
          echo "$plan" >> "$GITHUB_OUTPUT"
      - name: Rehearse the formula and tap pull request (read-only)
        # Checks the tap token, the tap's formula directory, a newer formula
        # on the tap and the pull request branch before the release becomes
        # public, since a published release cannot be taken back.
        if: steps.plan.outputs.tap == 'publish'
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          # Without a token a dry run cannot read the tap and would pass.
          [[ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]] || { echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set in the release environment"; exit 1; }
          ./build/hephaestus run --stages formula,tap --dry-run
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/hephaestus_*.tar.gz
            dist/hephaestus_*.zip
            dist/hephaestus_checksums.txt
      - name: Publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build/hephaestus run --stages release
      - name: Generate the formula and open a tap pull request
        if: steps.plan.outputs.tap == 'publish'
        env:
          # Fine-grained token or GitHub App token with contents and
          # pull-requests write on magicdrive/homebrew-tap only.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: ./build/hephaestus run --stages formula,tap
      - name: Generate the formula without publishing it (tap skipped)
        # Prereleases (skip_upload: auto): no tap token in this process; the
        # tap stage logs why it skips. The release is already published, so
        # a failure here must not turn the run red.
        if: steps.plan.outputs.tap == 'skip'
        continue-on-error: true
        run: ./build/hephaestus run --stages formula,tap
