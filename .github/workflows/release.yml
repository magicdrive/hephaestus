name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # The full CI, at the tagged commit, is the release gate.
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # sign provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build hephaestus from the tagged source
        run: make build
      - name: Build, archive and checksum
        run: ./build/hephaestus run --stages build,archive,checksum --fresh
      - name: Verify dist before publishing anything
        run: scripts/verify-dist.sh dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/hephaestus_*.tar.gz
            dist/hephaestus_*.zip
            dist/hephaestus_checksums.txt
      - name: Publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build/hephaestus run --stages release
      - name: Generate the formula and open a tap pull request
        env:
          # Fine-grained token or GitHub App token with contents and
          # pull-requests write on magicdrive/homebrew-tap only.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: ./build/hephaestus run --stages formula,tap
