name: Release rehearsal

# Exercises the release path against the real GitHub API without publishing
# anything: the same CI gate, read-only build job and separate publish job
# as release.yml, with hephaestus.rehearsal.yaml, which keeps the release a
# draft (no tag is created, nothing is public) and opens the formula pull
# request on a sandbox tap. Provenance attestation is not rehearsed: it
# writes a public transparency log entry.
#
# Clean up afterwards (the summary prints the commands): delete the draft
# release, and close the sandbox pull request and delete its branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Rehearsal version without "v", e.g. 0.1.0-rehearsal.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # A called workflow's jobs get at most what the caller grants:
    # action-boundary needs id-token: write to prove the token does not
    # reach build code.
    permissions:
      contents: read
      id-token: write

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the rehearsal version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rehearsal\.[0-9]+$ ]] || {
            echo "::error::version must look like 0.1.0-rehearsal.1"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build hephaestus
        run: make build
      - name: Build, archive and checksum
        run: ./build/hephaestus run --config hephaestus.rehearsal.yaml --stages build,archive,checksum --fresh --tag "v$VERSION"
      - name: Verify dist
        run: scripts/verify-dist.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  rehearse:
    needs: [ci, build]
    runs-on: ubuntu-latest
    environment: release-rehearsal
    permissions:
      contents: write # create and fill the draft release
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build hephaestus
        run: make build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify dist again
        run: scripts/verify-dist.sh dist
      - name: Draft release (twice, to check that a re-run is a no-op)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./build/hephaestus run --config hephaestus.rehearsal.yaml --stages release --tag "v$VERSION"
          ./build/hephaestus run --config hephaestus.rehearsal.yaml --stages release --tag "v$VERSION"
      - name: Formula and sandbox tap pull request (twice)
        env:
          # Fine-grained token with contents and pull-requests write on the
          # sandbox tap only, stored in the release-rehearsal environment.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          [[ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]] || { echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set in the release-rehearsal environment"; exit 1; }
          ./build/hephaestus run --config hephaestus.rehearsal.yaml --stages formula,tap --tag "v$VERSION"
          ./build/hephaestus run --config hephaestus.rehearsal.yaml --stages formula,tap --tag "v$VERSION"
      - name: Cleanup commands
        if: always()
        run: |
          {
            echo "### Clean up the rehearsal"
            echo '```sh'
            echo "gh release delete v$VERSION --repo $GITHUB_REPOSITORY --yes"
            echo "gh pr close hephaestus-$VERSION --repo magicdrive/homebrew-tap-sandbox --delete-branch"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
