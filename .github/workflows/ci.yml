name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet (host and windows)
        run: make vet
      - name: go mod tidy
        run: go mod tidy -diff
      - name: golangci-lint
        run: go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: shellcheck
        run: shellcheck scripts/*.sh testdata/e2e/boundary/probe.sh

  test:
    # Linux amd64 and arm64, macOS arm64, Windows amd64. macOS Intel runs
    # in ci-extended.yml (weekly, or with the ci-extended label).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit, golden and integration tests
        shell: bash
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        shell: bash
        run: go tool cover -func=coverage.out | tail -1

  race:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [go.mod, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - name: Race detector
        env:
          CGO_ENABLED: "1"
          GOTOOLCHAIN: local
        run: go test -race -count=1 ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every fuzz target for 10s
        run: scripts/fuzz.sh 10s
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"

  snapshot:
    # Hephaestus packages itself: build all targets, archive, checksum, and
    # verify the dist layout, exactly as the release workflow does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make snapshot
      - name: Snapshot as on a tag push
        # release.yml runs this CI on a tag push, where the runner sets
        # GITHUB_REF_TYPE=tag for every step; --snapshot must ignore it.
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME=v0.0.0-ci.1 GITHUB_REF=refs/tags/v0.0.0-ci.1 make snapshot

  homebrew-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Fixture → archives → formula → brew audit/install/test
        run: scripts/homebrew-e2e.sh

  action-smoke:
    # The composite action on every runner OS: Git Bash, the .exe suffix
    # and D:/a/_temp-style paths on Windows; BSD tools (env -u, mktemp) on
    # macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the action (snapshot build, archive, checksum)
        id: heph
        uses: ./
        with:
          working-directory: testdata/e2e/fixture
          stages: build,archive,checksum
          snapshot: "true"
      - name: Check outputs
        env:
          STATUS: ${{ steps.heph.outputs.status }}
          ARTIFACTS: ${{ steps.heph.outputs.artifacts }}
        run: |
          echo "status=$STATUS"
          [[ "$STATUS" == "no-op" ]]
          echo "$ARTIFACTS" | jq -e 'length == 5'
          # Every reported artifact exists where the output says.
          cd testdata/e2e/fixture
          # jq on Windows ends lines with CRLF.
          echo "$ARTIFACTS" | jq -r '.[].path' | tr -d '\r' | while read -r p; do
            [[ -f "$p" ]] || { echo "missing $p"; exit 1; }
          done
      - name: Check configuration
        uses: ./
        with:
          command: check
          working-directory: testdata/e2e/fixture
      - name: Release preflight (offline)
        # A pull request checks out a detached merge commit, so git.branch
        # fails: this checks that the action reports, not that it passes.
        id: preflight
        continue-on-error: true
        uses: ./
        with:
          command: preflight
          tag: v9.9.9
          offline: "true"
          working-directory: testdata/e2e/fixture
      - name: Check preflight outputs
        env:
          STATUS: ${{ steps.preflight.outputs.preflight-status }}
          CODE: ${{ steps.preflight.outputs.preflight-exit-code }}
          REPORT: ${{ steps.preflight.outputs.preflight-report }}
          OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          echo "status=$STATUS code=$CODE outcome=$OUTCOME report=$REPORT"
          jq -e '.schema_version == 1 and .offline == true and (.checks | length) > 20' "$REPORT"
          [[ "$(jq -r .status "$REPORT" | tr -d '\r')" == "$STATUS" ]]
          case "$STATUS" in
            pass|warn) [[ "$CODE" == 0 && "$OUTCOME" == success ]] ;;
            fail) [[ "$CODE" == 1 && "$OUTCOME" == failure ]] ;;
            *) echo "unexpected status"; exit 1 ;;
          esac
          jq -e '[.checks[] | select(.group == "github")] | all(.status == "SKIP")' "$REPORT"

  action-boundary:
    # Runs the action on a real runner with sentinel tokens in the job env,
    # the action inputs and an OIDC grant, and a build command (probe.sh)
    # that fails if any of them is visible to build code: in its own
    # environment, in an ancestor's environment, or through a dumpable
    # hephaestus process.
    # Linux reads ancestors' /proc/PID/environ and checks that hephaestus is
    # not dumpable; macOS reads them with ps -E; Windows can only check the
    # build's own environment.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write # only so that an OIDC request token exists to leak
    env:
      GITHUB_TOKEN: heph-boundary-sentinel-job-github-token
      GH_TOKEN: heph-boundary-sentinel-job-gh-token
      HOMEBREW_TAP_GITHUB_TOKEN: heph-boundary-sentinel-job-tap-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prefer Git Bash for the probe's build command
        if: runner.os == 'Windows'
        # Hephaestus runs "bash" by PATH lookup; make it Git Bash rather
        # than a WSL launcher.
        run: printf '%s\n' 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"
      - name: Run the action with sentinel tokens
        id: heph
        uses: ./
        with:
          working-directory: testdata/e2e/boundary
          stages: build
          snapshot: "true"
          github-token: heph-boundary-sentinel-input-github-token
          tap-token: heph-boundary-sentinel-input-tap-token
      - name: Check outputs
        env:
          STATUS: ${{ steps.heph.outputs.status }}
        run: |
          echo "status=$STATUS"
          [[ "$STATUS" == "no-op" ]]

  ci-gate:
    # The single required check, and what the release workflow waits for.
    if: always()
    needs: [lint, test, race, fuzz-smoke, snapshot, homebrew-e2e, action-smoke, action-boundary]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [[ "$r" == success ]] || exit 1; done
