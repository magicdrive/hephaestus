name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet (host and windows)
        run: make vet
      - name: go mod tidy
        run: go mod tidy -diff
      - name: golangci-lint
        run: go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: shellcheck
        run: shellcheck -x scripts/*.sh action/*.sh testdata/e2e/boundary/probe.sh testdata/e2e/completions/heph-comp cmd/hephaestus/completions/hephaestus.bash cmd/hephaestus/testdata/completion/complete.bash

  test:
    # Linux amd64 and arm64, macOS arm64, Windows amd64. macOS Intel runs
    # in ci-extended.yml (weekly, or with the ci-extended label).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit, golden and integration tests
        shell: bash
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        shell: bash
        run: go tool cover -func=coverage.out | tail -1

  completion:
    # `hephaestus completion` in real bash, zsh and fish (Linux and macOS,
    # where macOS adds its own bash 3.2). Missing shells fail the job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install fish
      - name: Shell versions
        run: bash --version | head -1; /bin/bash --version | head -1; zsh --version; fish --version
      - name: Completion in real shells
        env:
          HEPHAESTUS_COMPLETION_SHELLS: "1"
        run: go test -count=1 -run 'TestComplet' -v ./cmd/hephaestus/

  race:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [go.mod, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - name: Race detector
        env:
          CGO_ENABLED: "1"
          GOTOOLCHAIN: local
        run: go test -race -count=1 ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every fuzz target for 10s
        run: scripts/fuzz.sh 10s
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"

  snapshot:
    # Hephaestus packages itself: build all targets, archive, checksum, and
    # verify the dist layout, exactly as the release workflow does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make snapshot
      - name: Snapshot as on a tag push
        # release.yml runs this CI on a tag push, where the runner sets
        # GITHUB_REF_TYPE=tag for every step; --snapshot must ignore it.
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME=v0.0.0-ci.1 GITHUB_REF=refs/tags/v0.0.0-ci.1 make snapshot

  homebrew-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Fixture → archives → formula → brew audit/install/test
        run: scripts/homebrew-e2e.sh
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install fish
      - name: Completions in formulae; hephaestus 1.0.0 → this checkout (brew upgrade)
        env:
          HEPHAESTUS_COMPLETION_SHELLS: "1"
        run: scripts/homebrew-completion-e2e.sh

  action-binary:
    # The hephaestus binaries of the six platforms the action supports,
    # built from this commit, for the jobs that run the action from this
    # checkout (uses: ./ takes HEPHAESTUS_ACTION_BINARY instead of a
    # release download, see action/install-hephaestus.sh). Those jobs need
    # no Go of their own.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cross-build
        run: |
          v="$(tr -d '\r\n' < action/VERSION)-dev"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}" arch="${t#*/}" ext=""
            [[ "$os" == windows ]] && ext=.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$v" \
              -o "action-binaries/hephaestus-$os-$arch$ext" .
          done
          ls -l action-binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-binaries
          path: action-binaries/
          if-no-files-found: error
          retention-days: 1

  action-install:
    # The action's release path (action/install-hephaestus.sh) on every
    # platform it supports: crafted archives, references and checksums
    # (no network), then the published v1.1.0 release laid out as the
    # runner checks out an action pinned to its commit: download, release
    # checksum, provenance attestation bound to the commit and tag, version.
    # Another commit and a branch reference must fail. The job's PATH and
    # Go environment must be unchanged afterwards.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Crafted archives, references and checksums
        run: bash action/install-hephaestus_test.sh
      - name: Record the environment before
        run: scripts/go-env-snapshot.sh > "$RUNNER_TEMP/env-before"
      - name: Install the published v1.1.0 through the release path
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/action-install-e2e.sh v1.1.0 550d48f64917749742574b5c2ff1b292940ff71a b2ea250f3eaf2323735a96a787be517c26a248c1
      - name: The environment is unchanged
        run: |
          scripts/go-env-snapshot.sh > "$RUNNER_TEMP/env-after"
          diff -u "$RUNNER_TEMP/env-before" "$RUNNER_TEMP/env-after"

  action-smoke:
    needs: [action-binary]
    # The composite action on every runner OS: Git Bash, the .exe suffix
    # and D:/a/_temp-style paths on Windows; BSD tools (env -u, mktemp) on
    # macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: action-binaries
          path: ${{ runner.temp }}/action-binaries
      - name: Select the hephaestus binary built from this commit
        # uses: ./ runs the action from this checkout, whose version is not
        # released: it takes this binary (HEPHAESTUS_ACTION_BINARY) instead
        # of a release download.
        id: heph-bin
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) p=linux-amd64 ;; Linux/ARM64) p=linux-arm64 ;;
            macOS/X64) p=darwin-amd64 ;; macOS/ARM64) p=darwin-arm64 ;;
            Windows/X64) p=windows-amd64.exe ;; Windows/ARM64) p=windows-arm64.exe ;;
          esac
          f="$RUNNER_TEMP/action-binaries/hephaestus-$p"
          chmod +x "$f"
          if [[ "$RUNNER_OS" == Windows ]]; then f="$(cygpath -m "$f")"; fi
          echo "path=$f" >> "$GITHUB_OUTPUT"
      # The fixture is a Go program: like any caller, set up the Go that
      # builds it (the action does not provide one).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: testdata/e2e/fixture/go.mod
          cache: false
      - name: Run the action (snapshot build, archive, checksum)
        id: heph
        uses: ./
        env:
          HEPHAESTUS_ACTION_BINARY: ${{ steps.heph-bin.outputs.path }}
        with:
          working-directory: testdata/e2e/fixture
          stages: build,archive,checksum
          snapshot: "true"
      - name: Check outputs
        env:
          STATUS: ${{ steps.heph.outputs.status }}
          ARTIFACTS: ${{ steps.heph.outputs.artifacts }}
        run: |
          echo "status=$STATUS"
          [[ "$STATUS" == "no-op" ]]
          echo "$ARTIFACTS" | jq -e 'length == 5'
          # Every reported artifact exists where the output says.
          cd testdata/e2e/fixture
          # jq on Windows ends lines with CRLF.
          echo "$ARTIFACTS" | jq -r '.[].path' | tr -d '\r' | while read -r p; do
            [[ -f "$p" ]] || { echo "missing $p"; exit 1; }
          done
      - name: Check configuration
        uses: ./
        env:
          HEPHAESTUS_ACTION_BINARY: ${{ steps.heph-bin.outputs.path }}
        with:
          command: check
          working-directory: testdata/e2e/fixture
      - name: Release preflight (offline)
        # A pull request checks out a detached merge commit, so git.branch
        # fails; a push checks out a shallow clone without origin/HEAD, so
        # git.branch is unknown. This checks that the action reports, not
        # that it passes.
        id: preflight
        continue-on-error: true
        uses: ./
        env:
          HEPHAESTUS_ACTION_BINARY: ${{ steps.heph-bin.outputs.path }}
        with:
          command: preflight
          tag: v9.9.9
          offline: "true"
          working-directory: testdata/e2e/fixture
      - name: Check preflight outputs
        env:
          STATUS: ${{ steps.preflight.outputs.preflight-status }}
          CODE: ${{ steps.preflight.outputs.preflight-exit-code }}
          REPORT: ${{ steps.preflight.outputs.preflight-report }}
          OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          echo "status=$STATUS code=$CODE outcome=$OUTCOME report=$REPORT"
          jq -e '.schema_version == 1 and .offline == true and (.checks | length) > 20' "$REPORT"
          [[ "$(jq -r .status "$REPORT" | tr -d '\r')" == "$STATUS" ]]
          case "$STATUS" in
            pass|warn) [[ "$CODE" == 0 && "$OUTCOME" == success ]] ;;
            fail) [[ "$CODE" == 1 && "$OUTCOME" == failure ]] ;;
            unknown) [[ "$CODE" == 3 && "$OUTCOME" == failure ]] ;;
            *) echo "unexpected status"; exit 1 ;;
          esac
          jq -e '[.checks[] | select(.group == "github")] | all(.status == "SKIP")' "$REPORT"

  action-boundary:
    needs: [action-binary]
    # Runs the action on a real runner with sentinel tokens in the job env,
    # the action inputs and an OIDC grant, and a build command (probe.sh)
    # that fails if any of them is visible to build code: in its own
    # environment, in an ancestor's environment, or through a dumpable
    # hephaestus process.
    # Linux reads ancestors' /proc/PID/environ and checks that hephaestus is
    # not dumpable; macOS reads them with ps -E; Windows can only check the
    # build's own environment.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write # only so that an OIDC request token exists to leak
    env:
      GITHUB_TOKEN: heph-boundary-sentinel-job-github-token
      GH_TOKEN: heph-boundary-sentinel-job-gh-token
      HOMEBREW_TAP_GITHUB_TOKEN: heph-boundary-sentinel-job-tap-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: action-binaries
          path: ${{ runner.temp }}/action-binaries
      - name: Select the hephaestus binary built from this commit
        # uses: ./ runs the action from this checkout, whose version is not
        # released: it takes this binary (HEPHAESTUS_ACTION_BINARY) instead
        # of a release download.
        id: heph-bin
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) p=linux-amd64 ;; Linux/ARM64) p=linux-arm64 ;;
            macOS/X64) p=darwin-amd64 ;; macOS/ARM64) p=darwin-arm64 ;;
            Windows/X64) p=windows-amd64.exe ;; Windows/ARM64) p=windows-arm64.exe ;;
          esac
          f="$RUNNER_TEMP/action-binaries/hephaestus-$p"
          chmod +x "$f"
          if [[ "$RUNNER_OS" == Windows ]]; then f="$(cygpath -m "$f")"; fi
          echo "path=$f" >> "$GITHUB_OUTPUT"
      - name: Prefer Git Bash for the probe's build command
        if: runner.os == 'Windows'
        # Hephaestus runs "bash" by PATH lookup; make it Git Bash rather
        # than a WSL launcher.
        run: printf '%s\n' 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"
      - name: Run the action with sentinel tokens
        id: heph
        uses: ./
        env:
          HEPHAESTUS_ACTION_BINARY: ${{ steps.heph-bin.outputs.path }}
        with:
          working-directory: testdata/e2e/boundary
          stages: build
          snapshot: "true"
          github-token: heph-boundary-sentinel-input-github-token
          tap-token: heph-boundary-sentinel-input-tap-token
      - name: Check outputs
        env:
          STATUS: ${{ steps.heph.outputs.status }}
        run: |
          echo "status=$STATUS"
          [[ "$STATUS" == "no-op" ]]

  action-isolation:
    needs: [action-binary]
    # The action must leave the caller's Go toolchain as it found it: PATH,
    # which go, go version, GOTOOLCHAIN and every GO*/CGO_* variable are the
    # same before and after it runs (scripts/go-env-snapshot.sh), on every
    # GitHub-hosted platform, with Go 1.26 or 1.27 set up by the caller,
    # without setup-go, and for a project that is not Go. The fixture's
    # binary must be built by the caller's Go, not by the Go that built
    # Hephaestus. The action runs twice per job (the second run reuses the
    # downloaded toolchain archive after checking it again).
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, go: "1.26", fixture: fixture}
          - {os: ubuntu-latest, go: "1.27", fixture: fixture}
          - {os: ubuntu-latest, go: "", fixture: noarch}
          - {os: ubuntu-24.04-arm, go: "1.27", fixture: fixture}
          - {os: macos-latest, go: "1.26", fixture: fixture}
          - {os: macos-latest, go: "", fixture: noarch}
          - {os: macos-15-intel, go: "1.27", fixture: fixture}
          - {os: windows-latest, go: "1.27", fixture: fixture}
          - {os: windows-latest, go: "", fixture: noarch}
          - {os: windows-11-arm, go: "1.26", fixture: fixture}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: action-binaries
          path: ${{ runner.temp }}/action-binaries
      - name: Select the hephaestus binary built from this commit
        # uses: ./ runs the action from this checkout, whose version is not
        # released: it takes this binary (HEPHAESTUS_ACTION_BINARY) instead
        # of a release download.
        id: heph-bin
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) p=linux-amd64 ;; Linux/ARM64) p=linux-arm64 ;;
            macOS/X64) p=darwin-amd64 ;; macOS/ARM64) p=darwin-arm64 ;;
            Windows/X64) p=windows-amd64.exe ;; Windows/ARM64) p=windows-arm64.exe ;;
          esac
          f="$RUNNER_TEMP/action-binaries/hephaestus-$p"
          chmod +x "$f"
          if [[ "$RUNNER_OS" == Windows ]]; then f="$(cygpath -m "$f")"; fi
          echo "path=$f" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go != ''
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Record the Go environment before the action
        run: scripts/go-env-snapshot.sh | tee "$RUNNER_TEMP/go-env-before"
      - name: Run the action (snapshot)
        uses: ./
        env:
          HEPHAESTUS_ACTION_BINARY: ${{ steps.heph-bin.outputs.path }}
        with:
          working-directory: testdata/e2e/${{ matrix.fixture }}
          stages: ${{ matrix.fixture == 'noarch' && 'archive,checksum' || 'build,archive,checksum' }}
          snapshot: "true"
          github-token: ""
      - name: Run the action again (check)
        uses: ./
        env:
          HEPHAESTUS_ACTION_BINARY: ${{ steps.heph-bin.outputs.path }}
        with:
          command: check
          working-directory: testdata/e2e/${{ matrix.fixture }}
          github-token: ""
      - name: Compare the Go environment after the action
        run: |
          scripts/go-env-snapshot.sh > "$RUNNER_TEMP/go-env-after"
          diff -u "$RUNNER_TEMP/go-env-before" "$RUNNER_TEMP/go-env-after"
      - name: The fixture was built by the caller's Go
        if: matrix.fixture == 'fixture'
        run: |
          want="$(cd / && go env GOVERSION | tr -d '\r')"
          got="$(go version testdata/e2e/fixture/dist/bin/linux_amd64/heph-fixture | tr -d '\r')"
          echo "caller: $want; fixture binary: $got"
          [[ "$got" == *": $want" ]]

  action-isolation-detects-v1-1-0:
    # The comparison above must be able to fail: v1.1.0 of the action
    # (actions/setup-go inside) changes the caller's Go environment.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: scripts/go-env-snapshot.sh | tee "$RUNNER_TEMP/go-env-before"
      - uses: magicdrive/hephaestus@550d48f64917749742574b5c2ff1b292940ff71a # v1.1.0
        with:
          command: check
          working-directory: testdata/e2e/fixture
          github-token: ""
      - name: The comparison reports the change
        run: |
          scripts/go-env-snapshot.sh > "$RUNNER_TEMP/go-env-after"
          if diff -u "$RUNNER_TEMP/go-env-before" "$RUNNER_TEMP/go-env-after"; then
            echo "::error::v1.1.0 changed nothing that go-env-snapshot.sh sees; the isolation check cannot fail"
            exit 1
          fi

  ci-gate:
    # The single required check, and what the release workflow waits for.
    if: always()
    needs: [lint, test, completion, race, fuzz-smoke, snapshot, homebrew-e2e, action-binary, action-install, action-smoke, action-boundary, action-isolation, action-isolation-detects-v1-1-0]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [[ "$r" == success ]] || exit 1; done
