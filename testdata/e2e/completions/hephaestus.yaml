# End-to-end fixture for formula completions, independent of any language:
# a shell script whose bash and zsh completions are generated by the
# installed executable at install time, and whose fish completion is a file
# in the archive.
version: 1
project:
  name: heph-comp
  description: Completion fixture for Hephaestus end-to-end tests
  homepage: https://github.com/magicdrive/hephaestus
  license: MIT

archives:
  - id: script
    # No version in the name (see testdata/e2e/noarch/hephaestus.yaml).
    name: "{{ .Project }}_noarch"
    targets: [{os: all, arch: all}]
    files:
      - {src: heph-comp, dst: heph-comp, mode: "0755"}
      - {src: completions/heph-comp.fish, dst: completions/heph-comp.fish, mode: "0644"}
      - {src: README.md, dst: README.md, mode: "0644"}

brews:
  - name: heph-comp
    url_template: "{{ .Env.E2E_URL_BASE }}/{{ .ArtifactName }}"
    install: |
      bin.install "heph-comp"
    completions:
      generate:
        args: [completion]
        shells: [bash, zsh]
      files:
        fish: completions/heph-comp.fish
    test: |
      assert_match "alpha", shell_output("#{bin}/heph-comp alpha")
    repository:
      owner: magicdrive
      name: homebrew-tap
