# A Rust CLI built with cargo-zigbuild. Hephaestus does not cross-compile:
# the command maps each target to a Rust target triple and must leave the
# executable at HEPHAESTUS_OUTPUT.
version: 1

project:
  name: mycli
  description: Friendly tool for managing widgets
  homepage: https://github.com/acme/mycli
  license: MIT OR Apache-2.0

builds:
  - id: mycli
    targets:
      - {os: linux, arch: amd64}
      - {os: linux, arch: arm64}
      - {os: darwin, arch: amd64}
      - {os: darwin, arch: arm64}
    command: |
      set -eu
      case "$HEPHAESTUS_OS/$HEPHAESTUS_ARCH" in
        linux/amd64)  triple=x86_64-unknown-linux-musl ;;
        linux/arm64)  triple=aarch64-unknown-linux-musl ;;
        darwin/amd64) triple=x86_64-apple-darwin ;;
        darwin/arm64) triple=aarch64-apple-darwin ;;
        *) echo "unsupported target" >&2; exit 1 ;;
      esac
      cargo zigbuild --release --locked --target "$triple"
      cp "target/$triple/release/mycli" "$HEPHAESTUS_OUTPUT"
    output: "dist/bin/{{ .OS }}_{{ .Arch }}/mycli"
    timeout: 45m

archives:
  - id: default
    files:
      - src: "dist/bin/{{ .OS }}_{{ .Arch }}/mycli"
        dst: mycli
        mode: "0755"
      - LICENSE-MIT
      - LICENSE-APACHE
      - README.md

checksum:
  name: "{{ .Project }}_checksums.txt"

release:
  github:
    owner: acme
    name: mycli

brews:
  - name: mycli
    directory: Formula
    test: |
      assert_match version.to_s, shell_output("#{bin}/mycli --version")
    repository:
      owner: acme
      name: homebrew-tap
